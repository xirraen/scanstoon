var S={comics:[],home:null,details:{},saved:Array.isArray(saved)?saved:[],history:Array.isArray(history)?history:[],auth:!!initData,loading:true,error:'',filter:'all',sort:'popular',query:'',genre:''};
S.telegramPages={};S.telegramLoading={};
var icons={
home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',
explore:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',
library:'<path d="M4 5h16v15H4zM8 2v5M16 2v5"/><path d="M8 12h8M8 16h5"/>',
profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 16-5 16 0"/>',
bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
arrow:'<path d="m5 12 14 0m-6-6 6 6-6 6"/>',
back:'<path d="m15 18-6-6 6-6"/>',
play:'<path d="m7 4 13 8-13 8z"/>'
};
var labels={home:'Beranda',explore:'Jelajahi',library:'Koleksi',profile:'Profil'};
function icon(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(icons[n]||'')+'</svg>';}
function readStore(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')||f;}catch(e){return f;}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function safe(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function path(){return (location.hash||'#/home').replace(/^#\/?/,'').split('/');}
function go(route){location.hash='#/'+route;if(route===path().join('/'))render();window.scrollTo({top:0,behavior:'instant'});}
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toast.timer);toast.timer=setTimeout(function(){el.classList.remove('on');},2600);}
function call(url,opts){opts=opts||{};opts.headers=Object.assign({},opts.headers||{},initData?{'X-Telegram-Init-Data':initData}:{});
return fetch(url,opts).then(function(r){return r.json().then(function(j){if(!r.ok||!j.success)throw new Error(j.error&&j.error.message||'Gagal memuat data');return j.data;});});}
function isSaved(slug){return S.saved.indexOf(slug)!==-1;}
function art(c,cls){var n=Math.abs(Number(c.art_code)||0)%12;var mark=(c.title||'S').split(/\s+/).slice(0,2).map(function(x){return x[0]||'';}).join('');return '<div class="cover cover-'+n+' '+(cls||'')+'"><span class="cover-kicker">SCANSTOON ORIGINAL</span><div class="cover-shards"></div><span class="cover-symbol">'+safe(mark)+'</span><span class="cover-caption">'+safe(c.title)+'</span></div>';}
function card(c){return '<article class="comic-card"><button class="poster-link" data-go="detail/'+safe(c.slug)+'" aria-label="Lihat '+safe(c.title)+'">'+art(c)+'<div class="card-row"><div class="card-title">'+safe(c.title)+'</div><div class="card-details"><div class="card-meta">'+safe(c.type).toUpperCase()+' · <span>★ '+(Number(c.score)/20).toFixed(1)+'</span></div></div></div></button><button class="bookmark-mini '+(isSaved(c.slug)?'saved':'')+'" data-save="'+safe(c.slug)+'" title="'+(isSaved(c.slug)?'Hapus dari koleksi':'Simpan ke koleksi')+'" aria-label="'+(isSaved(c.slug)?'Hapus':'Simpan')+' '+safe(c.title)+'">'+icon('bookmark')+'</button></article>';}
function cards(rows){return rows.length?'<div class="card-grid">'+rows.map(card).join('')+'</div>':empty('Tidak ada judul ditemukan','Coba ubah pencarian atau filter.');}
function empty(title,copy){return '<div class="empty"><div class="empty-icon">✦</div><h3>'+safe(title)+'</h3><p>'+safe(copy)+'</p><button class="btn btn-primary" data-go="explore">Jelajahi katalog '+icon('arrow')+'</button></div>';}
function shell(){var p=path()[0];var active=['detail','read'].includes(p)?'explore':p;
['sidenav','bottomnav'].forEach(function(id){document.getElementById(id).innerHTML=Object.keys(labels).map(function(key){return '<button class="'+(id==='sidenav'?'side-link':'bottom-link')+(active===key?' active':'')+'" data-go="'+key+'">'+icon(key)+'<span>'+labels[key]+'</span></button>';}).join('');});
if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user){document.getElementById('avatar-letter').textContent=(tg.initDataUnsafe.user.first_name||'S').slice(0,1).toUpperCase();}}
function chips(){return '<div class="chips">'+[['all','Semua'],['manga','Manga'],['manhwa','Manhwa'],['manhua','Manhua'],['webtoon','Webtoon'],['donghua','Donghua'],['original','Original']].map(function(pair){return '<button class="chip '+(S.filter===pair[0]?'active':'')+'" data-filter="'+pair[0]+'">'+pair[1]+'</button>';}).join('')+'</div>';}
function filtered(){return S.comics.filter(function(c){var q=S.query.trim().toLowerCase();return (S.filter==='all'||c.type===S.filter)&&(!q||[c.title,c.subtitle,c.synopsis].join(' ').toLowerCase().includes(q))&&(!S.genre||(c.genres||[]).some(function(g){return g.toLowerCase()===S.genre;}));}).sort(function(a,b){return S.sort==='title'?a.title.localeCompare(b.title):S.sort==='latest'?String(b.updated_at).localeCompare(String(a.updated_at)):Number(b.score)-Number(a.score);});}
function home(){var first=S.comics[0];if(!first)return empty('Katalog belum tersedia','Silakan periksa koneksi dan coba lagi.');
var pop=(S.home&&S.home.popular)||S.comics;
return '<section class="hero"><div class="hero-copy"><div class="eyebrow">✦ YOUR NEXT UNIVERSE</div><h1>Setiap panel,<br><span class="gradient-text">dunia baru.</span></h1><p>Temukan cerita orisinal, susun daftar bacaan, dan lanjutkan petualanganmu dari mana saja.</p><div class="hero-actions"><button class="btn btn-primary" data-go="explore">Jelajahi cerita '+icon('arrow')+'</button><button class="btn btn-secondary" data-go="detail/'+safe(first.slug)+'">Pilihan editor '+icon('play')+'</button></div></div><div class="hero-poster">'+art(first,'large')+'</div><div class="hero-float">★ EDITOR\'S PICK</div></section>'
+'<section><div class="section-header"><div><div class="eyebrow">EXPLORE GENRES</div><h2 class="section-title">Apa yang ingin kamu baca?</h2></div></div>'+chips()+'</section>'
+'<section class="section"><div class="section-header"><div><h2 class="section-title">Populer minggu ini <span class="gradient-text">✦</span></h2><p class="section-sub">Kisah-kisah pilihan untuk kamu jelajahi</p></div><button class="link-btn" data-go="explore">Lihat semua →</button></div>'+cards((S.filter==='all'?pop:pop.filter(function(c){return c.type===S.filter;})).slice(0,10))+'</section>'
+'<section class="section"><div class="section-header"><div><h2 class="section-title">Baru di katalog</h2><p class="section-sub">Cerita original yang siap kamu mulai</p></div></div><div class="update-list">'+S.comics.slice(0,6).map(function(c){return '<button class="update-item" data-go="detail/'+safe(c.slug)+'">'+art(c)+'<div class="update-copy"><b>'+safe(c.title)+'</b><small>'+safe(c.type).toUpperCase()+' · '+safe(c.status)+'</small></div><span class="update-arrow">›</span></button>';}).join('')+'</div></section>';}
function explore(){var rows=filtered();return '<div class="eyebrow">STORY LIBRARY</div><h1 class="page-title">Jelajahi <span class="gradient-text">cerita.</span></h1><p class="muted">Cerita baru menantimu. Cari dunia favoritmu.</p><div class="search-row"><label class="search-box">'+icon('explore')+'<input id="search-input" type="search" maxlength="80" placeholder="Cari judul atau cerita..." value="'+safe(S.query)+'" autocomplete="off" aria-label="Cari cerita"></label><select id="sort-select" aria-label="Urutkan"><option value="popular" '+(S.sort==='popular'?'selected':'')+'>Terpopuler</option><option value="latest" '+(S.sort==='latest'?'selected':'')+'>Terbaru</option><option value="title" '+(S.sort==='title'?'selected':'')+'>A–Z</option></select></div>'+chips()+'<p class="result-note">'+rows.length+' cerita ditemukan</p>'+cards(rows);}
function library(){var list=S.saved.map(function(slug){return S.comics.find(function(c){return c.slug===slug;});}).filter(Boolean);var recent=S.history.map(function(x){return S.comics.find(function(c){return c.slug===x.slug;});}).filter(Boolean);return '<div class="eyebrow">YOUR PERSONAL SPACE</div><h1 class="page-title">Koleksi <span class="gradient-text">saya.</span></h1><p class="muted">Semua kisah yang ingin kamu simpan, di satu tempat.</p>'+(S.auth?'':'<div class="notice">Mode browser: koleksi dan progres tersimpan di perangkat ini. Buka melalui Telegram untuk sinkronisasi antarperangkat.</div>')+'<section class="section"><div class="section-header"><div><h2 class="section-title">Disimpan <span class="muted">('+list.length+')</span></h2><p class="section-sub">Daftar cerita favoritmu</p></div></div>'+(list.length?cards(list):empty('Koleksimu masih kosong','Tekan ikon bookmark pada judul yang ingin kamu baca nanti.'))+'</section><section class="section"><div class="section-header"><div><h2 class="section-title">Terakhir dibaca</h2><p class="section-sub">Kembali ke petualanganmu</p></div></div>'+(recent.length?'<div class="update-list">'+recent.map(function(c){var h=S.history.find(function(x){return x.slug===c.slug;})||{};return '<button class="update-item" data-go="read/'+safe(c.slug)+'/'+(h.chapter_number||1)+'">'+art(c)+'<div class="update-copy"><b>'+safe(c.title)+'</b><small>Chapter '+(h.chapter_number||1)+' · '+(h.percent||0)+'% selesai</small></div><span class="update-arrow">›</span></button>';}).join('')+'</div>':empty('Belum ada riwayat baca','Mulai membaca preview karya original untuk melihat progres.'))+'</section>';}
function profile(){var who=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;var name=who?who.first_name||'Pembaca':'Pembaca Scanstoon';return '<div class="eyebrow">YOUR READING IDENTITY</div><h1 class="page-title">Profil <span class="gradient-text">pembaca.</span></h1><div class="profile-panel"><div class="profile-avatar">'+safe(name.slice(0,1).toUpperCase())+'</div><div><h2>'+safe(name)+'</h2><p>'+(S.auth?'Terhubung melalui Telegram':'Pengunjung • mode lokal')+'</p></div></div><div class="metric-row"><div class="metric"><b>'+S.saved.length+'</b><small>Disimpan</small></div><div class="metric"><b>'+S.history.length+'</b><small>Dibaca</small></div><div class="metric"><b>'+S.comics.length+'</b><small>Katalog</small></div></div><div class="panel-box"><div class="eyebrow">TENTANG SCANSTOON</div><h3>Cerita yang dibawa ke mana saja.</h3><p>Scanstoon adalah katalog, tempat menyimpan favorit, dan melacak bacaan. Karya dalam demo ini adalah contoh fiksi orisinal, bukan salinan manga atau komik pihak ketiga.</p><p>Versi 0.1 • Cloudflare Workers + D1 • Telegram Mini App</p></div>';}
function detail(slug){var c=S.details[slug]||S.comics.find(function(c){return c.slug===slug;});if(!c){loadDetail(slug);return '<p class="muted">Memuat detail…</p>';}if(!c.chapters){loadDetail(slug);}
return '<button class="detail-back" data-go="explore">'+icon('back')+' Kembali ke katalog</button><div class="detail-layout"><div class="detail-art">'+art(c,'large')+'</div><div class="detail-content"><div class="eyebrow">'+safe(c.type).toUpperCase()+' · SCANSTOON ORIGINAL</div><h1>'+safe(c.title)+'</h1><p class="muted">'+safe(c.subtitle)+'</p><div class="stats"><span><b>★ '+(Number(c.score)/20).toFixed(1)+'</b> rating demo</span><span>● '+safe(c.status)+'</span></div><div class="tag-row">'+(c.genres||[]).map(function(g){return '<span class="tag">'+safe(g)+'</span>';}).join('')+'</div><p class="detail-description">'+safe(c.synopsis)+'</p><div class="detail-actions"><button class="btn btn-primary" data-go="read/'+safe(c.slug)+'/1">'+icon('play')+' Baca preview</button><button class="btn btn-outline" data-save="'+safe(c.slug)+'">'+icon('bookmark')+' '+(isSaved(c.slug)?'Tersimpan':'Simpan')+'</button></div></div></div><div class="notice">Preview reader berisi panel ilustrasi dan dialog original untuk menguji pengalaman membaca vertikal. Belum tersedia chapter lengkap.</div><section class="section"><div class="section-header"><div><h2 class="section-title">Daftar chapter</h2><p class="section-sub">Pratinjau cerita yang tersedia</p></div></div><div class="chapter-list">'+((c.chapters||[{number:1,title:'Prolog'}]).map(function(ch){return '<button class="chapter-item" data-go="read/'+safe(c.slug)+'/'+ch.number+'"><span><strong>Chapter '+ch.number+' — '+safe(ch.title)+'</strong><small>Preview original • baca vertikal</small></span>'+icon('arrow')+'</button>';}).join(''))+'</div></section>';}
function reader(slug,num){var c=S.details[slug]||S.comics.find(function(c){return c.slug===slug;});if(!c){loadDetail(slug);return '<p class="muted">Memuat pembaca…</p>';}var chapter=Math.max(1,Math.min(100,Number(num)||1));var lines=['Semua kisah bermula dari sebuah langkah kecil.','Ada dunia yang menunggu di balik cahaya.','Setiap pilihan meninggalkan jejaknya sendiri.','Dan petualangan sebenarnya baru saja dimulai.'];return '<div class="reader-width"><div class="reader-heading"><button class="detail-back" style="padding:0" data-go="detail/'+safe(slug)+'">'+icon('back')+' Detail komik</button><span class="muted tiny">MODE PREVIEW</span></div><div class="reader-headline"><div class="eyebrow">SCANSTOON READER</div><h1>'+safe(c.title)+'</h1><p class="muted">Chapter '+chapter+' • Preview original</p></div><div class="notice">Ini adalah preview pengalaman reader, bukan halaman chapter lengkap atau konten pihak ketiga.</div><div class="reader-pages">'+lines.map(function(line,i){return '<section class="reader-panel"><div class="reader-number">PANEL 0'+(i+1)+'</div><div class="reader-dialog">'+safe(line)+'</div></section>';}).join('')+'</div><div class="reader-end"><div class="eyebrow">THE STORY CONTINUES</div><h2>Akhir preview.</h2><p>Simpan progres dan temukan cerita menarik berikutnya.</p><button class="btn btn-primary" data-complete="'+safe(slug)+'" data-chapter="'+chapter+'">Tandai sudah dibaca ✓</button> <button class="btn btn-outline" data-go="detail/'+safe(slug)+'">Lihat chapter</button></div></div>';}

var previewReader=reader;
reader=function(slug,num){
  var chapter=Math.max(1,Math.min(100000,Number(num)||1)),key=slug+':'+chapter,pages=S.telegramPages[key];
  if(!pages||!pages.length)return previewReader(slug,num);
  var comic=S.details[slug]||S.comics.find(function(c){return c.slug===slug;})||{title:slug};
  return '<div class="reader-width"><div class="reader-heading"><button class="detail-back" data-go="detail/'+safe(slug)+'">'+icon('back')+' Detail komik</button><span class="muted tiny">TELEGRAM STORAGE</span></div><div class="reader-headline"><div class="eyebrow">SCANSTOON READER</div><h1>'+safe(comic.title)+'</h1><p class="muted">Chapter '+chapter+' · '+pages.length+' halaman</p></div><div class="reader-pages">'+pages.map(function(p){return '<img src="'+safe(p.url)+'" alt="Halaman '+Number(p.page)+'" loading="lazy" referrerpolicy="no-referrer" style="display:block;width:100%;height:auto" />';}).join('')+'</div><div class="reader-end"><h2>Akhir chapter.</h2><button class="btn btn-primary" data-complete="'+safe(slug)+'" data-chapter="'+chapter+'">Tandai sudah dibaca ✓</button></div></div>';
};

function loadDetail(slug){if(Object.prototype.hasOwnProperty.call(S.details,slug))return;S.details[slug]=S.comics.find(function(c){return c.slug===slug;})||{slug:slug,title:'Memuat…',genres:[],chapters:[]};call('/api/comics/'+encodeURIComponent(slug)).then(function(data){S.details[slug]=data;if(path()[1]===slug)render();}).catch(function(){toast('Detail belum dapat dimuat.');});}
function render(){shell();var p=path();var el=document.getElementById('content');if(S.loading){el.innerHTML='<div class="eyebrow">SCANSTOON</div><h1 class="page-title">Menyiapkan dunia ceritamu…</h1><p class="muted">Memuat katalog</p>';return;}var out=p[0]==='explore'?explore():p[0]==='library'?library():p[0]==='profile'?profile():p[0]==='detail'?detail(p[1]||''):p[0]==='read'?reader(p[1]||'',p[2]):home();el.innerHTML=out;
if(p[0]==='read'&&S.auth&&p[1]){
 var chapter=Number(p[2])||1,key=p[1]+':'+chapter;
 if(!S.telegramLoading[key]&&!S.telegramPages[key]){
   S.telegramLoading[key]=true;
   call('/api/storage/comics/'+encodeURIComponent(p[1])+'/chapters/'+chapter+'/pages').then(function(pages){S.telegramPages[key]=pages;if(path()[0]==='read'&&path()[1]===p[1])render();}).catch(function(e){toast('Halaman Telegram belum tersedia; menampilkan preview.');});
 }
}
if(S.error&&S.comics.length===0)el.innerHTML='<div class="notice">'+safe(S.error)+'</div>'+out;}
async function bookmarks(){
  if(!S.auth||!cloud)return;
  try{var keys=await tgKeys();S.saved=keys.filter(function(k){return k.indexOf('scs_b_')===0;}).map(function(k){return k.slice(6);});render();}
  catch(e){toast('Gagal memuat bookmark dari Telegram.');}
}
async function loadHistory(){
  if(!S.auth||!cloud)return;
  try{var keys=(await tgKeys()).filter(function(k){return k.indexOf('scs_h_')===0;}),items={};
    for(var i=0;i<keys.length;i+=100)Object.assign(items,await tgGetItems(keys.slice(i,i+100)));
    S.history=keys.map(function(key){var n=Number(items[key]);return {slug:key.slice(6),chapter_number:n,percent:100};}).filter(function(x){return Number.isSafeInteger(x.chapter_number)&&x.chapter_number>0;});render();
  }catch(e){toast('Gagal memuat progres dari Telegram.');}
}
async function toggleSave(slug){
  var yes=isSaved(slug);
  if(S.auth&&!cloud){toast('Telegram CloudStorage tidak tersedia.');return;}
  S.saved=yes?S.saved.filter(function(x){return x!==slug;}):[slug].concat(S.saved);render();
  if(!S.auth){store('scanstoon_saved',S.saved);toast(yes?'Dihapus dari koleksi':'Ditambahkan ke koleksi');return;}
  try{if(yes)await tgRemove('scs_b_'+slug);else await tgPut('scs_b_'+slug,'1');toast(yes?'Dihapus dari Telegram':'Tersimpan di Telegram');}
  catch(e){toast('Gagal menyinkronkan bookmark.');S.saved=yes?[slug].concat(S.saved):S.saved.filter(function(x){return x!==slug;});render();}
}
async function complete(slug,chapter){
  if(S.auth&&!cloud){toast('Telegram CloudStorage tidak tersedia.');return;}
  var item={slug:slug,chapter_number:chapter,percent:100};
  if(S.auth){try{await tgPut('scs_h_'+slug,String(chapter));}catch(e){toast('Gagal menyimpan progres di Telegram.');return;}}
  S.history=[item].concat(S.history.filter(function(x){return x.slug!==slug;}));
  if(!S.auth)store('scanstoon_history',S.history);
  toast('Progress baca disimpan'+(S.auth?' di Telegram':''));go('library');
}
document.addEventListener('click',function(e){var target=e.target.closest('button');if(!target)return;if(target.dataset.go){go(target.dataset.go);return;}if(target.dataset.filter){S.filter=target.dataset.filter;render();return;}if(target.dataset.save){toggleSave(target.dataset.save);return;}if(target.dataset.complete){complete(target.dataset.complete,Number(target.dataset.chapter));return;}});
document.addEventListener('change',function(e){if(e.target.id==='sort-select'){S.sort=e.target.value;render();}});
document.addEventListener('input',function(e){if(e.target.id!=='search-input')return;S.query=e.target.value;clearTimeout(S.searchTimer);S.searchTimer=setTimeout(function(){var pos=e.target.selectionStart;render();var field=document.getElementById('search-input');if(field){field.focus();try{field.setSelectionRange(pos,pos);}catch(err){}}},240);});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});
Promise.allSettled([call('/api/comics?limit=48'),call('/api/home')]).then(function(result){if(result[0].status==='fulfilled'){S.comics=result[0].value;}else{S.error='Tidak dapat terhubung ke katalog. Coba muat ulang halaman.';}if(result[1].status==='fulfilled')S.home=result[1].value;S.loading=false;render();bookmarks();loadHistory();});
render();
})();
</script></body></html>
