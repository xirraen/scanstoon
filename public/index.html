<script>
(function(){
'use strict';
var tg=window.Telegram&&window.Telegram.WebApp||null;try{if(tg){tg.ready();tg.expand();if(typeof tg.setHeaderColor==='function')tg.setHeaderColor('#080c17');if(typeof tg.setBackgroundColor==='function')tg.setBackgroundColor('#080c17');}}catch(e){}
var initData=tg&&tg.initData||'';

var cloud=tg&&tg.CloudStorage||null;
function tgKeys(){return new Promise(function(resolve,reject){if(!cloud)return reject(new Error('CloudStorage tidak tersedia'));cloud.getKeys(function(err,keys){if(err)reject(new Error('Telegram CloudStorage error'));else resolve(keys||[]);});});}
function tgGetItems(keys){return new Promise(function(resolve,reject){if(!keys.length)return resolve({});cloud.getItems(keys,function(err,items){if(err)reject(new Error('Telegram CloudStorage error'));else resolve(items||{});});});}
function tgPut(key,value){return new Promise(function(resolve,reject){if(!cloud)return reject(new Error('CloudStorage tidak tersedia'));cloud.setItem(key,value,function(err,ok){if(err||!ok)reject(new Error('Telegram CloudStorage error'));else resolve();});});}
function tgRemove(key){return new Promise(function(resolve,reject){if(!cloud)return reject(new Error('CloudStorage tidak tersedia'));cloud.removeItem(key,function(err,ok){if(err||!ok)reject(new Error('Telegram CloudStorage error'));else resolve();});});}

var saved=readStore('scanstoon_saved',[]);
var history=readStore('scanstoon_history',[]);
var preferences=readStore('scanstoon_preferences',{});
var checkins=readStore('scanstoon_checkins',[]);
var S={comics:[],home:null,details:{},saved:Array.isArray(saved)?saved:[],history:Array.isArray(history)?history:[],auth:!!initData,loading:true,error:'',filter:'all',sort:'popular',query:'',genre:'',status:'all',view:preferences.view==='list'?'list':'grid',theme:['light','dark','system'].includes(preferences.theme)?preferences.theme:'system',checkins:Array.isArray(checkins)?checkins.filter(function(k){return /^\d{8}$/.test(k);}).slice(0,45):[]};
function currentTheme(){return S.theme==='system'?((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'):S.theme;}
function applyTheme(){document.documentElement.dataset.theme=currentTheme();}
applyTheme();
if(window.matchMedia){var darkMedia=window.matchMedia('(prefers-color-scheme: dark)');if(darkMedia.addEventListener)darkMedia.addEventListener('change',function(){if(S.theme==='system'){applyTheme();render();}});}
S.telegramPages={};S.telegramLoading={};S.profilePanel='';S.pendingScroll='';
var icons={
home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',
explore:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',
library:'<path d="M4 5h16v15H4zM8 2v5M16 2v5"/><path d="M8 12h8M8 16h5"/>',
profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 16-5 16 0"/>',
activity:'<path d="M3 18h18M5 15l4-5 4 3 6-8"/><circle cx="19" cy="5" r="1"/>',
bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
arrow:'<path d="m5 12 14 0m-6-6 6 6-6 6"/>',

settings:'<circle cx="12" cy="12" r="3"/><path d="m20 13 1-2-2-2 .5-2.5L17 5l-2 1-2-2h-2L9 6 7 5 4.5 6.5 5 9l-2 2 1 2-1 2 2 2-.5 2.5L7 21l2-1 2 2h2l2-2 2 1 2.5-1.5L19 17l2-2z"/>',
spark:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/>',

moon:'<path d="M20 15a8 8 0 0 1-11-11 8.5 8.5 0 1 0 11 11z"/>',
system:'<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8M12 18v4"/>',
plus:'<path d="M12 4v16M4 12h16"/>'

};
var labels={home:'Beranda',explore:'Katalog',library:'Pustaka',activity:'Aktivitas',profile:'Akun'};
function icon(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(icons[n]||'')+'</svg>';}

function call(url,opts){opts=opts||{};opts.headers=Object.assign({},opts.headers||{},initData?{'X-Telegram-Init-Data':initData}:{});
return fetch(url,opts).then(function(r){return r.json().then(function(j){if(!r.ok||!j.success)throw new Error(j.error&&j.error.message||'Gagal memuat data');return j.data;});});}
function isSaved(slug){return S.saved.indexOf(slug)!==-1;}
function art(c,cls){var n=Math.abs(Number(c.art_code)||0)%12;var mark=(c.title||'S').split(/\s+/).slice(0,2).map(function(x){return x[0]||'';}).join('');var status=c.status==='completed'?'TAMAT':c.status==='hiatus'?'HIATUS':'ONGOING';return '<div class="cover cover-'+n+' '+(cls||'')+'"><span class="cover-kicker">SCANSTOON / '+safe(c.type||'ORIGINAL').toUpperCase()+'</span><span class="cover-badge">'+status+'</span><div class="cover-shards"></div><span class="cover-symbol">'+safe(mark)+'</span><span class="cover-caption">'+safe(c.title)+'</span></div>';}
function card(c){return '<article class="comic-card"><button class="poster-link" data-go="detail/'+safe(c.slug)+'" aria-label="Lihat '+safe(c.title)+'">'+art(c)+'<div class="card-row"><div class="card-title">'+safe(c.title)+'</div><div class="card-details"><div class="card-meta">'+safe(c.type).toUpperCase()+' · <span>★ '+(Number(c.score)/20).toFixed(1)+'</span></div></div></div></button><button class="bookmark-mini '+(isSaved(c.slug)?'saved':'')+'" data-save="'+safe(c.slug)+'" title="'+(isSaved(c.slug)?'Hapus dari koleksi':'Simpan ke koleksi')+'" aria-label="'+(isSaved(c.slug)?'Hapus':'Simpan')+' '+safe(c.title)+'">'+icon('bookmark')+'</button></article>';}

function shell(){var p=path()[0];var active=['detail','read'].includes(p)?'explore':p;

var last=S.history[0],comic=last&&S.comics.find(function(c){return c.slug===last.slug;});

}
function home(){var first=S.comics[0];if(!first)return empty('Katalog belum tersedia','Silakan periksa koneksi dan coba lagi.');
var pop=(S.home&&S.home.popular)||S.comics;
return '<div class="home-welcome"><div><span class="welcome-kicker">SCANSTOON / YOUR DAILY ESCAPE</span><h2 class="welcome-heading">Halo, siap menjelajah <span>cerita?</span></h2></div><button class="welcome-search" data-go="explore" aria-label="Cari cerita">'+icon('explore')+'<span>Cari cerita</span></button></div>'+'<section class="hero"><div class="hero-copy"><div class="eyebrow">✦ YOUR NEXT UNIVERSE</div><h1>Setiap panel,<br><span class="gradient-text">dunia baru.</span></h1><p>Temukan cerita orisinal, susun daftar bacaan, dan lanjutkan petualanganmu dari mana saja.</p><div class="hero-actions"><button class="btn btn-primary" data-go="explore">Jelajahi cerita '+icon('arrow')+'</button><button class="btn btn-secondary" data-go="detail/'+safe(first.slug)+'">Pilihan editor '+icon('play')+'</button></div></div><div class="hero-poster">'+art(first,'large')+'</div><div class="hero-float">★ EDITOR\'S PICK</div></section>'
+homeContinue()+'<section><div class="section-header"><div><div class="eyebrow">EXPLORE GENRES</div><h2 class="section-title">Apa yang ingin kamu baca?</h2></div></div>'+chips()+'</section>'
+'<section class="section"><div class="section-header"><div><h2 class="section-title">Populer minggu ini <span class="gradient-text">✦</span></h2><p class="section-sub">Kisah-kisah pilihan untuk kamu jelajahi</p></div><button class="link-btn" data-go="explore">Lihat semua →</button></div>'+cards((S.filter==='all'?pop:pop.filter(function(c){return c.type===S.filter;})).slice(0,10))+'</section>'
+'<section class="section"><div class="section-header"><div><h2 class="section-title">Baru di katalog</h2><p class="section-sub">Cerita original yang siap kamu mulai</p></div></div><div class="update-list">'+S.comics.slice(0,6).map(function(c){return '<button class="update-item" data-go="detail/'+safe(c.slug)+'">'+art(c)+'<div class="update-copy"><b>'+safe(c.title)+'</b><small>'+safe(c.type).toUpperCase()+' · '+safe(c.status)+'</small></div><span class="update-arrow">›</span></button>';}).join('')+'</div></section>';}

function explore(){
var rows=filtered(),genres=Array.from(new Set(S.comics.reduce(function(a,c){return a.concat(c.genres||[]);},[]))).sort(function(a,b){return a.localeCompare(b);});
return '<div class="eyebrow">SCANSTOON DISCOVERY</div><h1 class="page-title">Temukan <span class="gradient-text">ceritamu.</span></h1><p class="muted">Katalog original dengan pencarian dan filter yang lebih presisi.</p>'

window.addEventListener('resize',updateReadingProgress);

async function shareScanstoon(){
var url='https://scanstoon.ikomik-core.workers.dev';
try{
 if(navigator.share){await navigator.share({title:'Scanstoon',text:'Temukan cerita di Scanstoon',url:url});return;}
 if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(url);toast('Tautan Scanstoon disalin');return;}
}catch(e){if(e&&e.name==='AbortError')return;}
toast('Tautan berbagi: scanstoon.ikomik-core.workers.dev');
}
function handleProfileAction(action){
if(action==='history'){S.pendingScroll='reading-history';go('library');return;}
if(action==='latest'){S.sort='latest';S.filter='all';go('explore');return;}
if(action==='genre'){S.filter='all';S.genre='';go('explore');return;}
if(action==='share'){shareScanstoon();return;}
if(action==='backup'){exportBackup();return;}
if(action==='settings'){var area=document.getElementById('profile-themes');if(area)area.scrollIntoView({behavior:'smooth',block:'center'});return;}
if(['identity','alerts','support','about'].includes(action)){S.profilePanel=S.profilePanel===action?'':action;render();if(S.profilePanel)requestAnimationFrame(function(){var item=document.getElementById('p-panel-'+action);if(item)item.scrollIntoView({behavior:'smooth',block:'nearest'});});return;}
if(['activity','explore','library'].includes(action))go(action);
}
document.addEventListener('click',function(e){var target=e.target.closest('button');if(!target)return;if(target.dataset.go){go(target.dataset.go);return;}if(target.dataset.profileAction){handleProfileAction(target.dataset.profileAction);return;}if(target.dataset.themeChoice){S.theme=target.dataset.themeChoice;applyTheme();persistPreferences();render();return;}if(target.dataset.checkin){dailyCheckin();return;}if(target.dataset.themeToggle){S.theme=currentTheme()==='dark'?'light':'dark';applyTheme();persistPreferences();render();return;}if(target.dataset.exportBackup){exportBackup();return;}if(target.dataset.view){S.view=target.dataset.view==='list'?'list':'grid';persistPreferences();render();return;}if(target.dataset.resetFilters){S.filter='all';S.genre='';S.status='all';S.sort='popular';S.query='';render();return;}if(target.dataset.filter){S.filter=target.dataset.filter;render();return;}if(target.dataset.save){toggleSave(target.dataset.save);return;}if(target.dataset.complete){complete(target.dataset.complete,Number(target.dataset.chapter));return;}});
document.addEventListener('change',function(e){if(e.target.id==='sort-select'){S.sort=e.target.value;render();}if(e.target.id==='genre-select'){S.genre=e.target.value;render();}if(e.target.id==='status-select'){S.status=e.target.value;render();}});
document.addEventListener('input',function(e){if(e.target.id!=='search-input')return;S.query=e.target.value;clearTimeout(S.searchTimer);S.searchTimer=setTimeout(function(){var pos=e.target.selectionStart;render();var field=document.getElementById('search-input');if(field){field.focus();try{field.setSelectionRange(pos,pos);}catch(err){}}},240);});
if(tg&&tg.BackButton){try{tg.BackButton.onClick(function(){var p=path();go(p[0]==='read'?'detail/'+(p[1]||''):p[0]==='detail'?'explore':'home');});}catch(e){}}
document.addEventListener('click',function(e){if(tg&&tg.HapticFeedback&&e.target.closest('button[data-go],button[data-save],button[data-filter]')){try{tg.HapticFeedback.selectionChanged();}catch(err){}}},{capture:true});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});
Promise.allSettled([call('/api/comics?limit=48'),call('/api/home')]).then(function(result){if(result[0].status==='fulfilled'){S.comics=result[0].value;}else{S.error='Tidak dapat terhubung ke katalog. Coba muat ulang halaman.';}if(result[1].status==='fulfilled')S.home=result[1].value;S.loading=false;render();bookmarks();loadHistory();loadCheckins();});
render();
})();
</script></body></html>
