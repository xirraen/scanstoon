name: Scanstoon CI
on:
  pull_request:
  push:
    branches: [main]
  # Run manually *after* Cloudflare deployment to assert the deployed version.
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and worker build
        run: npm run check
      - name: API security smoke tests
        run: node --test tests/*.test.mjs

      # Production is tested only by the explicit post-deploy dispatch.
      # Pull requests and pushes must remain fully offline and deterministic.
      - name: Live Cloudflare C5 endpoint smoke test
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen, Request
          from urllib.error import HTTPError

          base = 'https://scanstoon.ikomik-core.workers.dev'
          expected_release = json.loads(Path('package.json').read_text())['version']
          # A push to main happens before the manual C5 upload. Do not compare
          # live release versions on that push; run workflow_dispatch after deploy.
          check_release = os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          for path in ['/api/health', '/api/telegram/status', '/api/comics?limit=48', '/api/home']:
              try:
                  req = Request(base + path, headers={'User-Agent':'Scanstoon-CI/1.0', 'Accept':'application/json'})
                  with urlopen(req, timeout=20) as response:
                      assert response.status == 200, (path, response.status)
                      body = json.load(response)
              except HTTPError as err:
                  print('LIVE HTTP ERROR:', path, err.code, 'Server:', err.headers.get('Server'),
                        'CF-Ray:', err.headers.get('CF-Ray'))
                  print('BODY:', err.read(1500).decode('utf-8', errors='replace'))
                  raise
              assert body.get('success') is True, (path, body)
              if path == '/api/health':
                  assert body['data']['status'] == 'ok'
                  if check_release:
                      assert body['data']['version'] == expected_release, (body['data']['version'], expected_release)
              if path == '/api/comics?limit=48':
                  assert isinstance(body['data'], list) and len(body['data']) > 0, (path, body)
                  assert all(isinstance(c.get('slug'), str) for c in body['data'])
                  print('Startup catalog available, titles:', len(body['data']))
              if path == '/api/home':
                  assert isinstance(body['data'].get('popular'), list)
              if path == '/api/telegram/status':
                  assert body['data']['webhook'] == 'ok'
                  assert body['data']['channel'] == 'admin'
          # Regression: bot-chat and Main Mini App must serve one uncached UI.
          with urlopen(Request(base + '/', headers={'User-Agent':'Scanstoon-CI/1.0','Accept':'text/html'}), timeout=20) as page:
              assert page.status == 200
              assert 'no-store' in (page.headers.get('Cache-Control') or '')
              release = page.headers.get('X-Scanstoon-Release')
              assert release and release != '0.7.0', release
              if check_release:
                  assert release == expected_release, (release, expected_release)
              html = page.read().decode('utf-8')
              assert 'data-runtime="telegram"' in html
              assert 'scs_pref_theme' in html
              if check_release:
                  assert 'scanstoon_public_catalog_v1' in html
                  assert 'Katalog belum tersedia' in html
          print('Unified Scanstoon UI smoke test passed, release', release)
          print('Cloudflare C5 smoke tests passed')
          PY
